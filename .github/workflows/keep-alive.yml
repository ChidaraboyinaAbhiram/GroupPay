name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (prevents Supabase 7-day inactivity pause)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          echo "Sending keep-alive ping to Supabase..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: sb_publishable_RTCeGgkkM-HT5F2vDBYXjA_brinolV2" "https://nprydrwziaztdfxjskdc.supabase.co/auth/v1/health")
          echo "Supabase response code: $STATUS"

      - name: Ping Vercel Deployment
        run: |
          echo "Sending keep-alive ping to Vercel app..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://grouppay-two.vercel.app")
          echo "Vercel response code: $STATUS"
